name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Build and verify all macOS archives
        id: package
        run: |
          ./scripts/package-macos.sh
          echo "directory=dist/v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            ${{ steps.package.outputs.directory }}/*.zip
            ${{ steps.package.outputs.directory }}/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - name: Publish release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "ClaudeBar $RELEASE_TAG" --notes-file RELEASE_NOTES.md \
            release-assets/*.zip release-assets/SHA256SUMS.txt
